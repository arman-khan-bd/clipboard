[package]
name = "clipstore"
version = "1.0.0"
description = "Lightweight cross-platform clipboard manager for Windows & Linux"
authors = ["ClipStore Team"]
license = "MIT"
repository = "https://github.com/example/clipstore"
edition = "2024"
rust-version = "1.90"

[lib]
name = "clipstore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
arboard = "3.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
