name: Build & Release ClipStore

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            os_name: "windows"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            os_name: "linux"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies (Ubuntu/Debian)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            rpm \
            file \
            curl \
            wget

      - name: Install Node dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "ClipStore v__VERSION__"
          releaseBody: |
            ## ClipStore v__VERSION__ Release 🚀

            Lightweight, fast cross-platform clipboard manager with system tray and global hotkeys.

            ### Downloads:
            - **Windows**:
              - Setup Installer (`.exe`): `clipstore___VERSION___x64-setup.exe`
              - Portable Executable (`.exe`): `clipstore-portable.exe`
              - MSI Installer (`.msi`): `clipstore___VERSION___x64_en-US.msi`
            - **Linux**:
              - Debian / Ubuntu (`.deb`): `clipstore___VERSION___amd64.deb`
              - Fedora / RHEL (`.rpm`): `clipstore-___VERSION___-1.x86_64.rpm`
              - Universal AppImage (`.AppImage`): `clipstore___VERSION___amd64.AppImage`
          releaseDraft: false
          prerelease: false

      # Prepare standalone portable binary for Windows
      - name: Prepare Windows Portable Executable
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-portable"
          Copy-Item "src-tauri\target\release\clipstore.exe" "dist-portable\clipstore-portable.exe"

      - name: Upload Windows Portable Artifact
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: clipstore-windows-portable
          path: dist-portable/clipstore-portable.exe
          if-no-files-found: warn

      # Upload all Windows installers (.exe setup and .msi)
      - name: Upload Windows Installers
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: clipstore-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # Upload all Linux packages (.deb, .rpm, .AppImage)
      - name: Upload Linux Packages
        if: matrix.os_name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: clipstore-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
